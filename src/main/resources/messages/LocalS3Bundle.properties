settings.buckets.comment=Comma-separated bucket names. Empty names and duplicates are ignored.
settings.iceberg.group=Iceberg REST catalog
settings.iceberg.enabled.label=Enable Iceberg REST catalog
settings.iceberg.enabled.comment=Served under {0} on the port of the S3 API. It vends the S3 endpoint and credentials, so clients only need its URI.
settings.iceberg.warehouse.label=Warehouse:
settings.iceberg.warehouse.comment=The s3:// location that tables are created under. Its bucket is created on start.
settings.iceberg.warehouse.invalid=Enter the s3:// location of a bucket with a valid name, for example s3://warehouse/
settings.buckets.invalid=Invalid bucket names: {0}. Use 3-63 lowercase letters, digits, dots or hyphens, starting and ending with a letter or digit.
notification.group=Local S3
notification.shared.title=Local S3 is shared
notification.shared.content=A Local S3 server is already running at {0} (for example, started by another IDE), so it is reused instead of starting a new one. Its data path and credentials are the ones of that server.
notification.takeOver.title=Local S3 is no longer shared at {0}
notification.takeOver.content=The Local S3 server started by another process has stopped, so this IDE started its own. Its data is stored in {0}, so buckets and objects of the previous server may be missing.
notification.startFailed.title=Local S3 failed to start at {0}
notification.startFailed.portInUse=Port {0} is already in use by another process. Choose another port in the settings, or stop the process that uses it.
notification.startFailed.dataLocked=The data path {0} is locked, most likely by Local S3 in another IDE instance. Use a different data path for this IDE, or use the same port so that the running server is shared.
notification.startFailed.other=Failed to start: {0}
notification.unexpectedStop.title=Local S3 stopped unexpectedly at {0}
notification.unexpectedStop.content=The Local S3 server started by this IDE is no longer running. Retry to start it again.
