settings.tls.comment=TLS uses the certificate in ~/.locals3/tls/ (locals3.pem and locals3-key.pem), shared by all IDEs. A self-signed one is generated if missing and renewed before it expires; replace both files to use your own, e.g. from mkcert. Clients must trust the certificate explicitly.
settings.autoStart.label=Start automatically when a project is opened
settings.autoStart.comment=After Local S3 is stopped manually, it isn't started automatically again until it is started manually or the IDE is restarted.
